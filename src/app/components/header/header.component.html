<header class="header">
  <div class="header-content">
    <div class="header-top">
      <div class="brand">
        <span class="logo">🔥</span>
        <div class="brand-details">
          <h1>Skinão Grill</h1>
          <span class="table-badge">Mesa 12</span>
        </div>
      </div>

      <div class="header-actions">
        <span class="status-badge"><span class="pulse-dot"></span> Aberto</span>
        <button class="cart-btn" aria-label="Carrinho" (click)="onCartClick()">
          <span class="cart-icon">🛒</span>
          <span class="cart-count" *ngIf="cartService.itemsCount() > 0">{{ cartService.itemsCount() }}</span>
        </button>
      </div>
    </div>

    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Buscar no cardápio (ex: Picanha, Cupim)..." (input)="onSearch($event)" />
    </div>
  </div>
</header>
