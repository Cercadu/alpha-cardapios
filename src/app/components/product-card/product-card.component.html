<div class="product-card" (click)="clickCard.emit(product)">
    <div class="product-details">
        <h3>{{ product.name }}</h3>

        <p *ngIf="product.description">{{ product.description }}</p>

        <!-- Vários preços diferentes (ex.: tamanhos do espetão) -->
        <div class="price-options" *ngIf="product.prices?.length && !hasUniformOptionPrices(product)">
            <div class="price-row" *ngFor="let option of product.prices">
                <span class="price-label">{{ option.label }}</span>
                <span class="price-value">R$ {{ option.value | number:'1.2-2' }}</span>
            </div>
        </div>

        <!-- Preço único ou opções com mesmo valor (sabor, com/sem gás) -->
        <div class="single-price" *ngIf="!product.prices?.length || hasUniformOptionPrices(product)">
            <span class="price-value">R$ {{ getCardDisplayPrice(product) | number:'1.2-2' }}</span>
        </div>
    </div>

    <div class="product-image-container">
        <img [src]="product.image" [alt]="product.name" />
    </div>
</div>
