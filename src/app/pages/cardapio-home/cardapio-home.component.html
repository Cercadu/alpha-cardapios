<app-header (search)="onSearch($event)" (openCart)="openCart()" (openAdmin)="openAdmin()"></app-header>

<app-banner></app-banner>

<app-category-list (categoryChange)="onCategoryChange($event)"></app-category-list>

<div class="products">
    <app-product-card 
      *ngFor="let prod of filteredProducts" 
      [product]="prod"
      (clickCard)="openProductDetail($event)"
    ></app-product-card>
</div>

@if (companyService.activeCompany().showAlphaArtesFooter) {
  <app-site-credit-footer></app-site-credit-footer>
}

<!-- Modal Expandido de Detalhes do Produto (iFood Style) -->
<app-product-detail-modal 
  *ngIf="selectedProduct" 
  [product]="selectedProduct" 
  (close)="closeProductDetail()"
></app-product-detail-modal>

@if (companyService.activeCompany().features.cart) {
  <app-cart-modal
    *ngIf="showCart"
    (close)="closeCart()"
  ></app-cart-modal>
}

@if (companyService.activeCompany().features.adminPanel) {
  <app-admin-modal
    *ngIf="showAdmin"
    (close)="closeAdmin()"
  ></app-admin-modal>
}
